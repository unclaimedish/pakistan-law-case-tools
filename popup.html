<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pakistan Law Case Tools</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <h1>Pakistan Law Case Tools</h1>
      <p id="count" class="subheading">Scanning this page…</p>
      <div class="actions">
        <button id="copyAll" class="button button-secondary" type="button" disabled>
          Copy all
        </button>
        <button id="copySelected" class="button button-secondary" type="button" disabled>
          Copy selected
        </button>
        <button id="export" class="button button-primary" type="button" disabled>
          Export .txt
        </button>
      </div>
      <button
        id="openCasePrintView"
        class="button button-secondary case-print-button"
        type="button"
        disabled
      >
        Open case print view
      </button>
      <button
        id="openBulkCasePrintView"
        class="button button-secondary case-print-button"
        type="button"
        disabled
      >
        Open up to 50 cases in print view
      </button>
      <p id="bulkPrintStatus" class="bulk-print-status" role="status" aria-live="polite">
        Uses the first 50 cases loaded in the current search results.
      </p>
      <div class="selection-bar">
        <label class="check-label">
          <input id="selectAll" type="checkbox" checked disabled>
          <span>Select all</span>
        </label>
        <span id="selectionCount" class="selection-count"></span>
      </div>
    </header>
    <main>
      <ul id="entries" aria-live="polite" aria-busy="true"></ul>
    </main>
    <footer class="attribution">
      <span>© 2026 Muhammad Abrar. All rights reserved.</span>
      <a href="mailto:notanothermailofme@proton.me">Contact</a>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
